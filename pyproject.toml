[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterforge"
version = "0.1.0"
description = "ClusterForge · 世界顶级聚类与表征学习系统（复用 scikit-learn/scipy/numpy，纯 numpy 离线兜底）"
authors = [{ name = "晨星", email = "CJX0712@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
sota = ["hdbscan>=0.8", "umap-learn>=0.5", "scikit-network>=0.11"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
clusterforge = "clusterforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clusterforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
